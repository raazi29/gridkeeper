name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      installers:
        description: "Also build the installers (NSIS / dmg / AppImage + deb) for this ref"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # rustc can overflow its default stack on the larger crates (see docs/HANDOFF.md, environment quirks).
  RUST_MIN_STACK: "16777216"
  # System libraries Tauri needs on Linux (WebKitGTK 4.1, GTK 3, tray, SVG icons).
  LINUX_DEPS: libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf build-essential

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_DEPS

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Runs on every OS: platform-dependent code takes an explicit OS in tests (src/lib/platform.ts).
      - name: Frontend unit tests
        run: npx vitest run

      # tauri::generate_context!() embeds the frontend (tauri.conf.json frontendDist = ../dist), so the Rust
      # crate only compiles once dist/ exists.
      - name: Build frontend (dist/ for generate_context)
        run: npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Unit tests plus the PTY integration tests: Windows spawns real pwsh/cmd under ConPTY
      # (pty/tests.rs); macOS / Linux spawn sh/sleep under a Unix pty (pty/tests_unix.rs) and test
      # process-group containment (pty/job.rs unix_tests). live_profiles tests are #[ignore].
      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # The app binary itself (debug): headless self-test everywhere (data folder, default shell in a PTY,
      # process containment), plus the real window + IPC under Xvfb on Linux (informational on macOS).
      # See scripts/ci/self-test.sh and src-tauri/src/selftest.rs.
      - name: Xvfb for the window self-test
        if: runner.os == 'Linux'
        run: sudo apt-get install -y xvfb xauth

      - name: Self-test of the debug binary
        shell: bash
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --bin gridkeeper
          bash scripts/ci/self-test.sh src-tauri/target/debug/gridkeeper dev

      # Informational for now (ROADMAP item 3): warnings and lint failures never fail the build.
      - name: cargo clippy (non-fatal)
        continue-on-error: true
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --lib --tests

  installer:
    name: installer (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.installers)
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            kind: nsis
            args: ""
            bin: src-tauri/target/release/gridkeeper.exe
            files: src-tauri/target/release/bundle/nsis/*.exe
          # One universal dmg (Apple Silicon + Intel).
          - os: macos-latest
            kind: macos-dmg
            args: --target universal-apple-darwin
            bin: src-tauri/target/universal-apple-darwin/release/gridkeeper
            files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: ubuntu-22.04
            kind: linux
            args: ""
            bin: src-tauri/target/release/gridkeeper
            files: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_DEPS

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: release

      # Unsigned builds (ROADMAP item 1); macOS is ad-hoc signed only (tauri.macos.conf.json). Bundle
      # targets per OS come from tauri.conf.json (nsis) and tauri.macos.conf.json / tauri.linux.conf.json.
      # This uploads workflow artifacts only; GitHub releases stay manual.
      - name: tauri build
        run: npx tauri build ${{ matrix.args }}

      - name: Xvfb for the window self-test
        if: runner.os == 'Linux'
        run: sudo apt-get install -y xvfb xauth

      # The shipped binary must pass the same self-tests before anything is uploaded. Windows release builds
      # are GUI-subsystem executables; Git Bash passes them its pipes, so the report still shows.
      - name: Self-test of the release binary
        shell: bash
        run: bash scripts/ci/self-test.sh "${{ matrix.bin }}" release

      - uses: actions/upload-artifact@v4
        with:
          name: gridkeeper-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}-${{ matrix.kind }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 30
