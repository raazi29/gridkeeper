[package]
name = "gridkeeper"
version = "0.2.0"
description = "Gridkeeper — GPU-accelerated multi-agent terminal workspace"
authors = ["Gridkeeper"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix avoids a bin/lib name clash on Windows (rust-lang/cargo#8519).
name = "gridkeeper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
parking_lot = "0.12"
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
which = "8"
dirs = "6"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"
regex = "1"
once_cell = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
base64 = "0.22"
# Mission file watcher (ReadDirectoryChangesW on Windows, inotify on Linux, FSEvents on macOS; no
# polling backend is used). `macos_fsevent` is required on macOS: without it notify's fsevent module
# has no `fsevent-sys` and the crate does not compile there.
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Credentials",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ProcessStatus",
  "Win32_System_Performance",
  "Win32_UI_WindowsAndMessaging",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
] }
# Same versions tauri-runtime-wry uses: WebView2 crash recovery (webview_guard), native browser
# panes (browser_view).
webview2-com = "0.39"
windows-core = "0.62"
# browser_view: IStream for snapshots, key state for app shortcuts. Same version and a subset of the
# features wry already enables, so nothing extra is compiled.
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_Input_KeyboardAndMouse",
] }
# Native browser panes (browser_view.rs): child webviews in the main window (`Window::add_child`).
# Windows only: on Linux Tauri packs child webviews into a GtkBox (they cannot be positioned), and on
# macOS the feature would change how the main webview is built without anyone having verified it.
# Note: with `unstable` the main webview is itself built as an auto-resizing child, and
# `get_webview_window("main")` returns None while browser views exist (use webview_guard::main_*).
tauri = { version = "2", features = ["unstable"] }

[target.'cfg(unix)'.dependencies]
# Process groups / sessions (kill, killpg, getsid), signal handling, getpwuid_r. Already in the
# lock file through portable-pty.
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"  # contain panics in per-session threads instead of aborting the app
strip = true
