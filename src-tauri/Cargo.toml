[package]
name = "gridkeeper"
version = "0.1.0"
description = "Gridkeeper — GPU-accelerated multi-agent terminal workspace"
authors = ["Gridkeeper"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix avoids a bin/lib name clash on Windows (rust-lang/cargo#8519).
name = "gridkeeper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
parking_lot = "0.12"
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
which = "8"
dirs = "6"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"
regex = "1"
once_cell = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ProcessStatus",
  "Win32_System_Performance",
  "Win32_UI_WindowsAndMessaging",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"  # contain panics in per-session threads instead of aborting the app
strip = true
