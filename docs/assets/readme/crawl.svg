<text class="in" x="450" y="186">A long time ago, in a terminal far, far away…</text>
<text class="l ep" style="animation-delay:4.2s">EPISODE I</text><text class="l ti" style="animation-delay:5.5s">THE GRID AWAKENS</text><text class="l p" style="animation-delay:7.3s" textLength="650" lengthAdjust="spacing">It is a period of terminal chaos. AI agents,</text><text class="l p" style="animation-delay:8.1s" textLength="650" lengthAdjust="spacing">scattered across a dozen lonely windows, wait</text><text class="l p" style="animation-delay:8.9s" textLength="650" lengthAdjust="spacing">for answers that never come. Orphaned shells</text><text class="l p" style="animation-delay:9.7s" textLength="650" lengthAdjust="spacing">linger after every crash, and the CPU burns hot</text><text class="l p" style="animation-delay:10.5s">from a thousand restless polling loops.</text><text class="l p" style="animation-delay:12.1s" textLength="650" lengthAdjust="spacing">Developers who command several accounts watch</text><text class="l p" style="animation-delay:12.9s" textLength="650" lengthAdjust="spacing">their identities collide, and every session is</text><text class="l p" style="animation-delay:13.7s">lost the moment the console window closes…</text><text class="l p" style="animation-delay:15.2s" textLength="650" lengthAdjust="spacing">Now, from the depths of ConPTY, a keeper rises.</text><text class="l p" style="animation-delay:16s" textLength="650" lengthAdjust="spacing">Armed with a GPU and Job Objects, it gathers</text><text class="l p" style="animation-delay:16.9s" textLength="650" lengthAdjust="spacing">every agent into one grid, and keeps watch for</text><text class="l p" style="animation-delay:17.7s">the one that needs you…</text>
<g class="st" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-weight="700" fill="#ffd84a" text-anchor="middle"><text x="450" y="150" font-size="22" letter-spacing="6">EPISODE I</text><text x="450" y="200" font-size="44" letter-spacing="4">THE GRID AWAKENS</text><text x="450" y="244" font-size="18" font-weight="400" fill="#c9d3e3">Every agent in one grid.</text></g>
</svg>
