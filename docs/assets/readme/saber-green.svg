<svg xmlns="http://www.w3.org/2000/svg" width="880" height="24" viewBox="0 0 880 24" role="img" aria-label="Green energy-blade section divider">
<title>Green energy-blade divider</title>
<style>
.b{transform-box:view-box;transform-origin:104px 12px;transform:scaleX(0);animation:ig .55s cubic-bezier(.2,.9,.25,1) .35s forwards}
.h{animation:hm 2.6s ease-in-out 1s infinite alternate}
.f{animation:fl .19s steps(2,end) 1s infinite}
@keyframes ig{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes hm{0%{opacity:.62}100%{opacity:1}}
@keyframes fl{0%{opacity:1}100%{opacity:.88}}
@media (prefers-reduced-motion:reduce){.b{animation:none;transform:none}.h,.f{animation:none}}
</style>
<defs>
<linearGradient id="m" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9dee6"/><stop offset=".45" stop-color="#8a93a3"/><stop offset="1" stop-color="#3b414c"/></linearGradient>
<filter id="gl" x="-2%" y="-120%" width="104%" height="340%"><feGaussianBlur stdDeviation="3.2"/></filter>
<filter id="gs" x="-2%" y="-80%" width="104%" height="260%"><feGaussianBlur stdDeviation="1.3"/></filter>
</defs>
<g>
<g class="b">
<g class="h"><rect x="104" y="7" width="762" height="10" rx="5" fill="#1fd64a" filter="url(#gl)"/></g>
<g class="f"><rect x="104" y="9" width="762" height="6" rx="3" fill="#48f070" filter="url(#gs)"/>
<rect x="104" y="10.4" width="762" height="3.2" rx="1.6" fill="#f3fff4"/></g>
</g>

<g>
<rect x="10" y="8" width="12" height="8" rx="2" fill="#5b6270"/>
<rect x="20" y="7" width="54" height="10" rx="2" fill="url(#m)"/>
<rect x="25" y="7" width="2.6" height="10" fill="#1d2129"/><rect x="31.6" y="7" width="2.6" height="10" fill="#1d2129"/><rect x="38.2" y="7" width="2.6" height="10" fill="#1d2129"/><rect x="44.8" y="7" width="2.6" height="10" fill="#1d2129"/><rect x="51.4" y="7" width="2.6" height="10" fill="#1d2129"/><rect x="58" y="7" width="2.6" height="10" fill="#1d2129"/><rect x="64.6" y="7" width="2.6" height="10" fill="#1d2129"/>
<rect x="74" y="8" width="8" height="8" fill="#3a404b"/>
<rect x="76" y="9.8" width="3.5" height="4.4" rx="1" fill="#48f070"/>
<rect x="82" y="5.5" width="20" height="13" rx="2" fill="url(#m)"/>
<rect x="98" y="5" width="6" height="14" rx="1.5" fill="#9aa3b2"/>
</g>
</g>
</svg>
