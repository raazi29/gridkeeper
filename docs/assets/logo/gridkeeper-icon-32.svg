<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Gridkeeper icon, 32 px variant (taskbar at 125-150 %, Explorer medium icons). Same
       proportions as the 16 px variant at 2x, with a 1 px rim and a hint of light on the lit pane. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121a27"/>
      <stop offset="1" stop-color="#07090d"/>
    </linearGradient>
    <linearGradient id="lit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fdcff"/>
      <stop offset="1" stop-color="#3fb4ff"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#tile)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke="#9cc4ee" stroke-opacity="0.24"/>
  <rect x="4" y="4" width="10" height="10" rx="2" fill="#e7ecf4"/>
  <rect x="18" y="4" width="10" height="10" rx="2" fill="url(#lit)"/>
  <rect x="4" y="18" width="10" height="10" rx="2" fill="#e7ecf4" fill-opacity="0.5"/>
  <rect x="18" y="18" width="10" height="10" rx="2" fill="#e7ecf4" fill-opacity="0.5"/>
</svg>
