<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Gridkeeper</title>
  <!-- Gridkeeper app icon, mid variant for 40-96 px (ICO 48/64, Start menu tiles).
       Same as gridkeeper-icon.svg minus the star specks and the prompt glyph (they turn to noise
       below ~100 px), with heavier brackets so they stay crisp. -->
  <defs>
    <clipPath id="tileClip">
      <rect x="40" y="40" width="944" height="944" rx="208"/>
    </clipPath>

    <!-- Tile: cool deep-space falloff, lightest just behind the lit pane. -->
    <radialGradient id="tileFill" cx="600" cy="420" r="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#132036"/>
      <stop offset="0.45" stop-color="#0b111c"/>
      <stop offset="1" stop-color="#05070b"/>
    </radialGradient>
    <radialGradient id="vignette" cx="512" cy="512" r="700" gradientUnits="userSpaceOnUse">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="40" x2="0" y2="984" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b9d6f5" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#9cc4ee" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#9cc4ee" stop-opacity="0.22"/>
    </linearGradient>

    <!-- Ink: the theme's text colour with a little top light. -->
    <linearGradient id="ink" x1="0" y1="290" x2="0" y2="734" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f5f8fc"/>
      <stop offset="1" stop-color="#d3dbe7"/>
    </linearGradient>
    <linearGradient id="bracket" x1="0" y1="176" x2="0" y2="848" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e7ecf4"/>
      <stop offset="1" stop-color="#a9b7cb"/>
    </linearGradient>

    <!-- Lit pane: ion blue rim into a cyan-white core. -->
    <radialGradient id="litFill" cx="672" cy="336" r="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d4faff"/>
      <stop offset="0.3" stop-color="#84ebff"/>
      <stop offset="0.72" stop-color="#43c6ff"/>
      <stop offset="1" stop-color="#2b8de6"/>
    </radialGradient>
    <linearGradient id="litEdge" x1="0" y1="290" x2="0" y2="490" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="glowNear" x="290" y="40" width="694" height="700" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <filter id="glowFar" x="40" y="40" width="944" height="944" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="120"/>
    </filter>
  </defs>

  <!-- Tile -->
  <rect x="40" y="40" width="944" height="944" rx="208" fill="url(#tileFill)"/>

  <g clip-path="url(#tileClip)">
    <!-- ambient signal light spilling onto the tile -->
    <rect x="534" y="290" width="200" height="200" rx="40" fill="#3fb8ff" opacity="0.38" filter="url(#glowFar)"/>


    <rect x="40" y="40" width="944" height="944" fill="url(#vignette)"/>
  </g>

  <!-- top-lit rim -->
  <rect x="42" y="42" width="940" height="940" rx="206" fill="none" stroke="url(#rim)" stroke-width="4"/>

  <!-- HUD corner brackets -->
  <path d="M196 358V250a54 54 0 0 1 54-54h108M666 196h108a54 54 0 0 1 54 54v108M828 666v108a54 54 0 0 1-54 54H666M358 828H250a54 54 0 0 1-54-54V666"
        fill="none" stroke="url(#bracket)" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- the keeper's signal: glow under the lit pane -->
  <rect x="534" y="290" width="200" height="200" rx="40" fill="#41c8ff" opacity="0.8" filter="url(#glowNear)"/>

  <!-- 2x2 panes -->
  <rect x="290" y="290" width="200" height="200" rx="40" fill="url(#ink)"/>
  <rect x="290" y="534" width="200" height="200" rx="40" fill="url(#ink)" opacity="0.46"/>
  <rect x="534" y="534" width="200" height="200" rx="40" fill="url(#ink)" opacity="0.46"/>
  <rect x="534" y="290" width="200" height="200" rx="40" fill="url(#litFill)"/>
  <rect x="536" y="292" width="196" height="196" rx="38" fill="none" stroke="url(#litEdge)" stroke-width="4"/>
</svg>
